# Este arquivo é onde configuramos o comportamento da aplicação Spring Boot.

spring:
  application:
    name: clt-rag-assistant

  # Dados de conexão com o Postgres que vamos subir via docker-compose.yml.
  # Em produção, usuário/senha NUNCA ficam direto aqui no arquivo (isso é só pra
  # desenvolvimento local) - mais pra frente valeria mover pra variáveis de ambiente.
  datasource:
    url: jdbc:postgresql://localhost:5432/cltrag
    username: cltrag
    password: cltrag

server:
  port: 8080
