name: CI

# Roda automaticamente a cada push ou pull request na branch main - é assim que
# um "badge" verde de build passando aparece no README, e é o que impede um
# commit quebrado de passar despercebido.
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest

    # Assim como no docker-compose.yml local, aqui subimos um Postgres com
    # pgvector só pra rodar os testes - o teste que sobe o contexto completo
    # da aplicação (CltRagAssistantApplicationTests) precisa de um banco de
    # verdade pra aplicar as migrations do Flyway.
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: cltrag
          POSTGRES_USER: cltrag
          POSTGRES_PASSWORD: cltrag
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Baixar o código
        uses: actions/checkout@v4

      # IMPORTANTE: usamos o JDK 21 aqui de propósito, não uma versão mais nova.
      # Descobrimos durante o desenvolvimento que o Mockito (usado nos testes)
      # não funciona em versões muito recentes do Java - então fixamos a versão
      # que sabemos que funciona, tanto aqui quanto na configuração local.
      - name: Configurar JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: maven

      - name: Rodar os testes
        run: mvn test
